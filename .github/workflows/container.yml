name: Container

on:
  release:
    types: [ published ]
  pull_request:
    paths:
      - '.containerignore'
      - 'Containerfile'
      - 'scripts/container.*'
      - 'tests/container/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [ "main" ]
    paths:
      - '.containerignore'
      - 'Containerfile'
      - 'scripts/container.*'
      - 'tests/container/**'
      - 'package.json'
      - 'package-lock.json'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  container-audit:
    name: Container Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build local image for verification
        uses: redhat-actions/buildah-build@v3
        with:
          image: localhost/patternfly-mcp
          tags: latest
          containerfiles: ./Containerfile

      - name: Audit Container
        run: npm run container:test

  publish:
    name: Container Image Publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [ container-audit ]
    # Explicitly locks down execution to stable GitHub release publications only
    if: |
      github.repository == 'patternfly/patternfly-mcp' &&
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      !github.event.release.prerelease &&
      !contains(github.event.release.tag_name, '-')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates 'X.Y.Z' and 'latest' from your Git Release Tag natively
      - name: Setup OCI metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
            type=raw,value=latest

      - name: Setup QEMU for multi-arch
        uses: docker/setup-qemu-action@v4
        with:
          platforms: 'linux/amd64,linux/arm64'

      - name: Build multi-arch image
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          archs: amd64, arm64
          containerfiles: ./Containerfile

      - name: Push image to registry
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}
          registry: ${{ env.REGISTRY }}
